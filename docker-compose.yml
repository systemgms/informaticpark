services:
  db:
    image: postgres:16-alpine
    container_name: informaticpark-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: informaticpark
      POSTGRES_USER: informaticpark
      POSTGRES_PASSWORD: informaticpark_dev
    ports:
      - "5432:5432"
    volumes:
      - informaticpark-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U informaticpark -d informaticpark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  informaticpark-postgres:
